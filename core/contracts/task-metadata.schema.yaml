# Documentation contract for active and closed Delivery lifecycle metadata. This is intentionally not a JSON Schema validator.
contract:
  name: task-metadata
  version: v2
  purpose: Captures a delivery's lifecycle navigation, scope, evidence, decisions, and knowledge-maintenance outcome.
required_fields:
  delivery_id:
    type: string
  title:
    type: string
  status:
    type: string
    allowed_values: [active, completed, blocked, superseded]
  repositories:
    type: list
    item_type: string
  capabilities:
    type: list
    item_type: string
  related_deliveries:
    type: list
    item_type: string
  product:
    type: string
  created_at:
    type: date-time
  evidence:
    type: list
    item_fields: [source, summary]
  knowledge_update_assessment:
    type: string
    allowed_values: [updated, not-needed, deferred]
optional_fields:
  phase:
    type: string
    allowed_values: [impact, contract, execution, stabilization]
  gates:
    type: map
  artifacts:
    type: map
  current_focus:
    type: map
  last_verified:
    type: list
  next_actions:
    type: list
  adr:
    type: path
  archived_at:
    type: date-time
  sensitive_data_review:
    type: string
  closed_index:
    type: path
  archive_reference:
    type: string
rules:
  - Feature Delivery task packages use delivery_id as the stable lifecycle identifier and Context Address; child tasks may use CAP-xx, DEV-xx, EXT-xx, INT-xx, or BUG-xx identifiers inside their authoritative artifact.
  - repositories lists every repository in the confirmed delivery scope; do not infer a repository merely from product knowledge or an example.
  - task.yaml is lifecycle state and artifact navigation, not a copy of requirements or contracts.
  - feature delivery task packages include resume.md as a non-authoritative resume cache; code, approved contracts, task artifacts, and reproducible evidence remain authoritative.
  - reopening a closed Delivery resolves its configured immutable external archive first and legacy local archive only as fallback, then restores/copies its complete package to active, removes its Workbench Closed Index, preserves delivery_id, sets status to active, removes archived_at, archive_reference, and closed_index, and records Reopened At, Reason, Previous Closing Status, Previous Closed At, Archive Reference, related BUG/CAP, and Current Classification in the integration log; it never moves or deletes the Vault archive.
  - completed, blocked, and superseded Deliveries complete only through user-authorized Delivery Closing: create a work/closed Thin Context Index after the full package is stored in configured cold archive; retained work/**/tasks/archive/ is legacy/local compatibility only.
  - active packages remain status: active until Closing has integrated Product Truth, completed Sensitive Data Review, verified external archive, and created a closed index; archived_at, archive_reference, and closed_index are recorded only in the archived final historical snapshot, not as active-state transitions.
  - a DEV, BUG, or INT Task Loop Verify updates its parent phase artifact only; it does not trigger Delivery Closing.
  - completed Delivery Closing requires acceptance evidence and normally G4; blocked and superseded Deliveries may also close, integrating only verified facts that remain current-worthy.
  - Archive means lifecycle closed and cold context, not successful delivery; superseded records link the replacement through related_deliveries or an equivalent reference and do not promote replaced designs as Current Product Truth.
  - capabilities and related_deliveries provide context routing only; they do not replace Product Truth, approved artifacts, or evidence.
  - a closed_index and archive_reference point to cold historical context after Delivery Closing; archive_reference uses deterministic logical tu-vault:<delivery_archive_root>/<delivery_id> form and external archive access must be configured before Closing, never assumed.
  - evidence must be reproducible references, never copied secrets or sensitive payloads.
  - an ADR reference is required when the task records a durable architectural decision.
