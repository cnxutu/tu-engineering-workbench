# 本机工作区映射模板。复制为 workspace.local.yaml 后填写本机绝对路径。
# workspace.local.yaml 已被 Git 忽略，禁止提交个人目录、凭据或其他敏感信息。
workspace:
  id: local-workspace
  roots:
    p0: <set-local-p0-path>
    company: <set-local-company-root>
    personal: <set-local-personal-root>
repositories:
  - code: P0
    repository: tu-devkit
    path: <set-local-p0-path>
    role: AI 工程上下文与开发工具主库
  - code: P1
    repository: c-drone-inspection
    path: <set-local-p1-path>
    product: company/device-inspection-platform
    role: 巡检业务、设备、任务、媒体、视频与巡检 IoT 业务
  - code: P2
    repository: c-iot-server
    path: <set-local-p2-path>
    product: company/device-inspection-platform
    role: IoT 业务、设备状态、Data Rule 与消息处理
  - code: P3
    repository: c-iot-gateway
    path: <set-local-p3-path>
    product: company/device-inspection-platform
    role: 协议接入、连接管理与消息上下行入口
  - code: P4
    repository: ad-iot-codec-adapter-dji
    path: <set-local-p4-path>
    product: company/device-inspection-platform
    role: DJI 协议解析、物模型转换与设备能力映射
  - code: K1
    repository: knowledge-hub
    path: <set-local-k1-path>
    product: personal/knowledge-hub
    role: Knowledge Hub 后端
  - code: K2
    repository: knowledge-web
    path: <set-local-k2-path>
    product: personal/knowledge-hub
    role: Knowledge Hub 前端
  - code: K5
    repository: tu-language-lab
    path: <set-local-k5-path>
    role: 语言学习与快速 Demo 运行
  - code: A1
    repository: tu-ai-lab
    path: <set-local-a1-path>
    role: 个人 AI 功能集合工程
