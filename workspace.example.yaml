# 本机工作区路径映射模板。仓库身份和产品绑定以
# core/registry/repositories.yaml 为准；复制为 workspace.local.yaml 后填写绝对路径。
# workspace.local.yaml 已被 Git 忽略，禁止提交个人目录、凭据或其他敏感信息。
external_contexts:
  # Optional external historical context target. tu-vault is not a registered source repository.
  tu_vault:
    path: <set-local-tu-vault-path>
    delivery_archive_root: <set-tu-vault-delivery-archive-root>
repositories:
  - code: P0
    path: <set-local-p0-path>
  - code: P0-1
    path: <set-local-p0-1-path>
  - code: P1
    path: <set-local-p1-path>
  - code: P2
    path: <set-local-p2-path>
  - code: P3
    path: <set-local-p3-path>
  - code: P3-1
    path: <set-local-p3-1-path>
  - code: P4
    path: <set-local-p4-path>
  - code: P4-1
    path: <set-local-p4-1-path>
  - code: P5
    path: <set-local-p5-path>
  - code: P6
    path: <set-local-p6-path>
  - code: P7
    path: <set-local-p7-path>
  - code: P10
    path: <set-local-p10-path>
  - code: K1
    path: <set-local-k1-path>
  - code: K2
    path: <set-local-k2-path>
  - code: K5
    path: <set-local-k5-path>
  - code: L1
    path: <set-local-l1-path>
  - code: A1
    path: <set-local-a1-path>
  - code: S1
    path: <set-local-s1-path>
